name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: last_pair
          POSTGRES_USER: last_pair_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U last_pair_app -d last_pair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://last_pair_app:ci_test_password@localhost:5432/last_pair
      APP_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed test catalogue
        run: pnpm db:seed

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run lint checks
        run: pnpm lint

      - name: Build application
        run: pnpm build

      - name: Run database integration tests
        run: pnpm test:rendered
